# Полная замена /etc/nginx/nginx.conf: без директивы `user` и с pid в /tmp,
# чтобы nginx стартовал от непривилегированного пользователя.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    # Временные каталоги в /tmp — единственное место, доступное на запись non-root пользователю
    client_body_temp_path /tmp/nginx_client;
    proxy_temp_path /tmp/nginx_proxy;
    fastcgi_temp_path /tmp/nginx_fastcgi;
    uwsgi_temp_path /tmp/nginx_uwsgi;
    scgi_temp_path /tmp/nginx_scgi;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    server {
        # 8080 вместо 80: порты < 1024 недоступны без root
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Загрузка изображений ресторанов идёт через этот же прокси
        client_max_body_size 20m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        # Проксирование API. Префикс /api сохраняется: FastAPI создан с root_path="/api"
        # и сам срезает его при матчинге маршрутов. Через /api/static/... отдаются
        # и загруженные бэкендом файлы.
        location /api/ {
            # Встроенный DNS Docker + proxy_pass через переменную: имя `backend`
            # переразрешается на лету, а не залипает на IP с момента старта nginx
            resolver 127.0.0.11 valid=30s ipv6=off;
            set $backend_upstream http://backend:8000;
            proxy_pass $backend_upstream$request_uri;

            proxy_http_version 1.1;
            # $http_host, а не $host: сохраняет порт из исходного запроса, иначе
            # 307-редиректы FastAPI (маршруты с завершающим слэшем) теряют :8080
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
        }

        # Ассеты CRA содержат хеш в имени файла — кэшируются навсегда
        location /static/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html кэшировать нельзя, иначе клиент не увидит новый билд
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        # Fallback для React Router: любой неизвестный путь отдаёт SPA
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
