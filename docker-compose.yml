name: restaurant-reservation

services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    # Кодировка совпадает с той, что README требует для ручного CREATE DATABASE
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-restaurant_db}
      MYSQL_USER: ${MYSQL_USER:-restaurant}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - backend_net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # Стартует только после того, как MySQL реально принимает соединения,
    # иначе alembic upgrade head в entrypoint упадёт
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-restaurant}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE:-restaurant_db}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      FROM_EMAIL: ${FROM_EMAIL:-}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    volumes:
      # Загруженные картинки не должны исчезать при пересборке образа
      - backend_uploads:/app/static/uploads
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend_net
      - frontend_net

  frontend:
    build:
      context: ./frontend
      target: production
      args:
        # Относительный /api → запросы идут на тот же origin и проксируются nginx
        REACT_APP_API_URL: ${REACT_APP_API_URL:-/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - '${FRONTEND_PORT:-8080}:8080'
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:8080/healthz']
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - frontend_net

volumes:
  db_data:
  backend_uploads:

networks:
  # БД изолирована от внешнего мира; наружу ходит только backend через frontend_net
  backend_net:
    internal: true
  frontend_net:
